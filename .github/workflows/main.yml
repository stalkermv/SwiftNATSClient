name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NATS_SERVER_VERSION: 2.11.8

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            nats_platform: linux-amd64
            nats_sha256: 397a6deffb5533e160de0cca322bc3dcaec7fb7282d66a3dfa87a9c183152ad1
          - os: xcode-27
            nats_platform: darwin-arm64
            nats_sha256: 23e0c5354c2da385708946a21900c944fcb9a3bbfd02aae27a4ae750dea0b682

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg libssl-dev pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install openssl@3 pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Swift on Linux
        if: runner.os == 'Linux'
        run: |
          version=$(cat .swift-version)
          release="swift-$version-RELEASE"
          archive="$release-ubuntu24.04.tar.gz"
          url="https://download.swift.org/swift-$version-release/ubuntu2404/$release/$archive"
          signing_key=52BB7E3DE28A71BE22EC05FFEF80A866B47A981F
          cd "$RUNNER_TEMP"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          curl -fsSL --retry 3 https://www.swift.org/keys/all-keys.asc | gpg --batch --import
          curl -fsSL --retry 3 --output "$archive" "$url"
          curl -fsSL --retry 3 --output "$archive.sig" "$url.sig"
          gpg --batch --status-fd 1 --verify "$archive.sig" "$archive" \
            | grep -F "[GNUPG:] VALIDSIG $signing_key "
          tar -xzf "$archive"
          rm "$archive" "$archive.sig"
          echo "$RUNNER_TEMP/$release-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"

      - name: Install Swift on macOS
        if: runner.os == 'macOS'
        run: |
          version=$(cat .swift-version)
          release="swift-$version-RELEASE"
          installer="$RUNNER_TEMP/$release-osx.pkg"
          url="https://download.swift.org/swift-$version-release/xcode/$release/$release-osx.pkg"
          curl -fsSL --retry 3 --output "$installer" "$url"
          pkgutil --check-signature "$installer"
          sudo /usr/sbin/installer -pkg "$installer" -target /
          rm "$installer"
          echo "/Library/Developer/Toolchains/$release.xctoolchain/usr/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=/Applications/Xcode_27.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install nats-server
        env:
          NATS_PLATFORM: ${{ matrix.nats_platform }}
          NATS_SHA256: ${{ matrix.nats_sha256 }}
        run: |
          nats_release="nats-server-v$NATS_SERVER_VERSION-$NATS_PLATFORM"
          bin_dir="$RUNNER_TEMP/nats-bin"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --output "$nats_release.tar.gz" \
            "https://github.com/nats-io/nats-server/releases/download/v$NATS_SERVER_VERSION/$nats_release.tar.gz"
          printf '%s  %s\n' "$NATS_SHA256" "$nats_release.tar.gz" | shasum -a 256 --check
          mkdir -p "$bin_dir"
          tar -xzf "$nats_release.tar.gz" -C "$bin_dir" --strip-components=1 "$nats_release/nats-server"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Verify toolchain and broker versions
        run: |
          swift --version | grep -F "Swift version $(cat .swift-version) "
          nats-server -v | grep -Fx "nats-server: v$NATS_SERVER_VERSION"
          pkg-config --modversion openssl

      - name: Run debug tests
        run: swift test --configuration debug

      - name: Run release tests
        run: swift test --configuration release

      - name: Build a package that depends on SwiftNATSClient
        run: bash Scripts/smoke-consumer.sh
